name: Amazon Clone S3 Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy HTML CSS Website
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy Website to S3
        run: |
          aws s3 sync . s3://s3-amazon-clone-rajjan \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"
