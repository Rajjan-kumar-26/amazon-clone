
name: Deploy HTML Website to Ubuntu EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. setup ssh
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 3. test ec2 connection
      - name: Test EC2 Connection
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "echo 'EC2 connection successful'"

      # 4. deploy website
      - name: Deploy Website
        run: |
          rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            -e "ssh -i ~/.ssh/ec2_key" \
            ./ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/

      # 5. restart nginx
      - name: Restart Nginx
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl restart nginx"

      # 6. verify nginx
      - name: Verify Nginx
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl is-active nginx"
